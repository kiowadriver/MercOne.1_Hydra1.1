#####################################################################
# Macros - ZeroG Mercury One.1 + Hydra 1.1 (Beacon contact homing)
#
# Every macro lives here; printer.cfg is hardware only.
# PAUSE / RESUME / CANCEL_PRINT are the stock ones from mainsail.cfg,
# tuned through _CLIENT_VARIABLE below - do not redefine them here.
#
# Crash safety, in order of what can go wrong:
#  1. First G28 with Z unknown: Beacon lowers the bed blindly by
#     [beacon] home_z_hop before X/Y home (Y homes at the REAR).
#     If the nozzle may be closer than that to the bed, run BED_DOWN first.
#  2. After any Z homing, _BEACON_POST_Z lifts the bed to _SAFE.safe_z
#     until Z tilt has been applied, so travel to a high corner can't hit.
#  3. LEVEL_BED / START_PRINT level in two passes: a coarse pass from a
#     high travel height, re-home, then a fine pass from a lower one.
#     Klipper aborts Z tilt if the probed range grows between retries.
#####################################################################

[gcode_macro _SAFE]
description: Safety limits shared by the macros below
variable_safe_z: 15              # bed height after homing until Z tilt is applied
variable_coarse_move_z: 30       # travel height for the coarse Z tilt pass
variable_fine_move_z: 10         # travel height once the bed is roughly level
variable_coarse_tolerance: 1.0   # mm, coarse pass (Klipper max is 1.0)
variable_fine_tolerance: 0.02    # mm, fine pass
variable_probe_temp: 150         # nozzle temp for Beacon contact (Beacon refuses above 180)
variable_max_bed_temp: 120
variable_min_extruder_temp: 170
variable_max_extruder_temp: 280
gcode:

#####################################################################
# Homing and levelling
#####################################################################

[gcode_macro _BEACON_POST_Z]
description: Runs after every Z home (Beacon hook): lift the bed clear of a possibly tilted bed
gcode:
  {% set s = printer['gcode_macro _SAFE'] %}
  {% set z = s.fine_move_z if printer.z_tilt.applied else s.safe_z %}
  SAVE_GCODE_STATE NAME=_post_z
  G90
  {% if printer.toolhead.position.z < z %}
    G0 Z{z} F480
  {% endif %}
  RESTORE_GCODE_STATE NAME=_post_z

[gcode_macro BED_DOWN]
description: Lower the bed DIST mm (default 20, max 50) without homing. Use before the first G28 when the nozzle may be near the bed. Check the bed is not already at the bottom.
gcode:
  {% set dist = params.DIST|default(20)|float %}
  {% if dist <= 0 or dist > 50 %}
    {action_raise_error("BED_DOWN: DIST must be between 0 and 50 mm")}
  {% endif %}
  {% if printer.print_stats.state == "printing" %}
    {action_raise_error("BED_DOWN: not while printing")}
  {% endif %}
  SAVE_GCODE_STATE NAME=_bed_down
  {% if "z" in printer.toolhead.homed_axes %}
    {% set target = [printer.toolhead.position.z + dist, printer.toolhead.axis_maximum.z]|min %}
    G90
    G0 Z{target} F480
  {% else %}
    # Pretend Z=0 just long enough to move all three Z motors together, then forget it again
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=z
    G91
    G0 Z{dist} F480
    M400
    SET_KINEMATIC_POSITION CLEAR_HOMED=z
  {% endif %}
  RESTORE_GCODE_STATE NAME=_bed_down

[gcode_macro LEVEL_BED]
description: Home if needed, then Z tilt in two passes (coarse from high up, then fine) with a Z re-home after each
gcode:
  {% set s = printer['gcode_macro _SAFE'] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  Z_TILT_ADJUST HORIZONTAL_MOVE_Z={s.coarse_move_z} RETRIES=3 RETRY_TOLERANCE={s.coarse_tolerance}
  G28 Z
  Z_TILT_ADJUST HORIZONTAL_MOVE_Z={s.fine_move_z} RETRIES=5 RETRY_TOLERANCE={s.fine_tolerance}
  G28 Z

#####################################################################
# Print start / end
#####################################################################

[gcode_macro START_PRINT]
description: Slicer start - START_PRINT BED_TEMP=<C> EXTRUDER_TEMP=<C>
gcode:
  {% set s = printer['gcode_macro _SAFE'] %}
  {% if params.BED_TEMP is not defined or params.EXTRUDER_TEMP is not defined %}
    {action_raise_error("START_PRINT needs BED_TEMP and EXTRUDER_TEMP, e.g. START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]")}
  {% endif %}
  {% set BED = params.BED_TEMP|float %}
  {% set HOTEND = params.EXTRUDER_TEMP|float %}
  {% if BED > s.max_bed_temp or HOTEND < s.min_extruder_temp or HOTEND > s.max_extruder_temp %}
    {action_raise_error("START_PRINT: temperature out of range (bed %.0f, hotend %.0f)" % (BED, HOTEND))}
  {% endif %}
  {% set nozzle_hot = printer.extruder.temperature > s.probe_temp + 10 %}

  CLEAR_PAUSE
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0
  G90
  M140 S{BED}                          # bed starts heating now
  M104 S{s.probe_temp}                 # nozzle to probing temp
  {% if nozzle_hot %}
    # Left hot from a previous print: Beacon refuses contact above 180C, so cool first
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={s.probe_temp + 3}
    M107
  {% endif %}

  G28                                  # X, Y, then Beacon contact at the bed centre
  {% if not printer.z_tilt.applied %}  # tilt only changes when the Z motors lose power (Klipper resets the flag then)
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z={s.coarse_move_z} RETRIES=3 RETRY_TOLERANCE={s.coarse_tolerance}
    G28 Z                              # re-home after the big correction
  {% endif %}

  G0 Z2 F480                           # Beacon 2 mm over the bed centre for heat soak
  M190 S{BED}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s.probe_temp - 3} MAXIMUM={s.probe_temp + 3}
  G4 P20000                            # let temperatures settle

  G28 Z METHOD=CONTACT CALIBRATE=1     # hot Z offset + Beacon model
  Z_TILT_ADJUST HORIZONTAL_MOVE_Z={s.fine_move_z} RETRIES=5 RETRY_TOLERANCE={s.fine_tolerance}
  BED_MESH_CALIBRATE RUNS=2 ADAPTIVE=1 # Beacon scan, only the printed area when objects are labelled
  _CHECK_MESH                          # abort if the mesh looks wrong
  G28 Z METHOD=CONTACT CALIBRATE=0     # final Z zero after tilt and mesh

  M109 S{HOTEND}
  SET_GCODE_OFFSET Z=0.06              # hotend thermal expansion; tune per first layer
  PRIME_LINE

[gcode_macro PRIME_LINE]
description: Two purge lines along the left edge
gcode:
  SAVE_GCODE_STATE NAME=_prime
  G90
  M83
  G0 Z2 F480
  G0 X22 Y30 F6000
  G0 Z0.3 F480
  G1 Y200 E15 F1500
  G0 X22.4 F5000
  G1 Y30 E15 F1500
  G1 E-0.5 F1800
  G0 Z2 F480
  RESTORE_GCODE_STATE NAME=_prime

[gcode_macro END_PRINT]
description: Slicer end - retract, lower the bed 10 mm (within limits), park rear-centre, heaters and motors off
gcode:
  {% set th = printer.toolhead %}
  {% set lift = [10, th.axis_maximum.z - th.position.z]|min %}
  M400
  SAVE_GCODE_STATE NAME=_end
  {% if printer.extruder.can_extrude %}
    M83
    G1 E-3 F1800
  {% endif %}
  G91
  G0 Z{lift} F480
  G90
  G0 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y - 5} F9000
  RESTORE_GCODE_STATE NAME=_end
  TURN_OFF_HEATERS
  M107
  BED_MESH_CLEAR
  M84

#####################################################################
# Pause / resume / cancel settings (macros come from mainsail.cfg)
#####################################################################

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 123.5   # centre
variable_custom_park_y    : 220.0   # rear, out of the way
variable_custom_park_dz   : 10.0    # lower the bed 10 mm when parking
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 8.0     # max_z_velocity
variable_speed_move       : 150.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 1800    # while paused, heaters stay on 30 min before idle timeout
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: ""
gcode:

[gcode_macro M600]
description: Filament change - pause, park front-left with the bed at least 50 mm down, unload. Then LOAD_FILAMENT and RESUME
gcode:
  PAUSE X=10 Y=10 Z_MIN=50
  UNLOAD_FILAMENT
  RESPOND TYPE=command MSG="action:prompt_begin Filament change"
  RESPOND TYPE=command MSG="action:prompt_text Old filament is out. Insert the new one, press Load, check the purge, then Resume."
  RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME|info"
  RESPOND TYPE=command MSG="action:prompt_show"

#####################################################################
# Filament
#####################################################################
# The slicer's filament start G-code calls SET_FILAMENT, so the loaded material and its print temperature are
# remembered (variables.cfg, survives restarts). LOAD/UNLOAD use that temperature unless TEMP= is given.
# Outside a print they home if needed (nozzle must be <=180C for Beacon contact), park front-left with the bed
# at least 50 mm down, and turn the heater off again afterwards if they were the ones that heated it.

[gcode_macro SET_FILAMENT]
description: Remember the loaded filament - SET_FILAMENT TYPE=PLA TEMP=215
gcode:
  {% set type = params.TYPE|default("unknown")|upper %}
  {% set temp = params.TEMP|default(0)|int %}
  {% set s = printer['gcode_macro _SAFE'] %}
  {% if temp < s.min_extruder_temp or temp > s.max_extruder_temp %}
    {action_raise_error("SET_FILAMENT: TEMP %d out of range" % temp)}
  {% endif %}
  SAVE_VARIABLE VARIABLE=filament_type VALUE='"{type}"'
  SAVE_VARIABLE VARIABLE=filament_temp VALUE={temp}
  RESPOND MSG="Filament: {type} at {temp}C"

[gcode_macro _FILAMENT_PREP]
description: Helper for LOAD/UNLOAD - home and park when idle, then heat to TEMP
gcode:
  {% set temp = params.TEMP|float %}
  {% set idle = printer.print_stats.state not in ["printing", "paused"] %}
  {% if idle %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      {% if printer.extruder.temperature > printer.configfile.settings.beacon.contact_max_hotend_temperature %}
        {action_raise_error("Not homed and the nozzle is above 180C: let it cool, run G28, then try again")}
      {% endif %}
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=_fil_park
    G90
    G0 Z{[[printer.toolhead.position.z, 50]|max, printer.toolhead.axis_maximum.z]|min} F480
    G0 X10 Y10 F9000
    RESTORE_GCODE_STATE NAME=_fil_park
  {% endif %}
  M109 S{temp}

[gcode_macro _FILAMENT_DONE]
description: Helper for LOAD/UNLOAD - heater off when idle and the macro did the heating
gcode:
  M400
  {% if params.WAS_COLD|int == 1 and printer.print_stats.state not in ["printing", "paused"] %}
    M104 S0
    RESPOND MSG="Heater off"
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load and purge (TEMP= overrides the remembered filament temperature)
variable_load_distance: 50   # fast feed from the gears down towards the melt zone
variable_purge_distance: 25  # slow purge until the colour runs clean
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set temp = [params.TEMP|default(sv.filament_temp|default(220))|float, printer.extruder.target]|max %}
  {% set was_cold = 1 if printer.extruder.target == 0 else 0 %}
  {% set speed = params.SPEED|default(300) %}
  {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
  _FILAMENT_PREP TEMP={temp}
  SAVE_GCODE_STATE NAME=_load
  M83
  G1 E{load_distance} F{max_velocity}
  G1 E{purge_distance} F{speed}
  G1 E-1 F1800  # small retract so it doesn't ooze while you check it
  RESTORE_GCODE_STATE NAME=_load
  _FILAMENT_DONE WAS_COLD={was_cold}

[gcode_macro UNLOAD_FILAMENT]
description: Form a clean tip and unload (TEMP= overrides the remembered filament temperature)
variable_unload_distance: 50
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set temp = [params.TEMP|default(sv.filament_temp|default(220))|float, printer.extruder.target]|max %}
  {% set was_cold = 1 if printer.extruder.target == 0 else 0 %}
  {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
  _FILAMENT_PREP TEMP={temp}
  SAVE_GCODE_STATE NAME=_unload
  M83
  # tip forming: short push to soften, fast pull out of the melt zone, then cooling moves in the cold zone so
  # the end comes out as a clean taper instead of a string or blob that jams on reload
  G1 E5 F300
  G1 E-15 F3600
  G1 E8 F600
  G1 E-8 F600
  G1 E8 F600
  G1 E-8 F600
  G4 P2000
  G1 E-{unload_distance - 15} F{max_velocity}
  RESTORE_GCODE_STATE NAME=_unload
  _FILAMENT_DONE WAS_COLD={was_cold}

#####################################################################
# Config backup (klipper-backup)
#####################################################################

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_macro UPDATE_GIT]
description: Push the config to GitHub now via klipper-backup
gcode:
  RUN_SHELL_COMMAND CMD=update_git_script

[gcode_macro _CHECK_MESH]
description: Abort the print if the bed mesh range is implausible (debris, sheet not seated, probe fault)
variable_max_range: 0.5
gcode:
  {% set m = printer.bed_mesh.probed_matrix %}
  {% if m and m|length > 0 %}
    {% set flat = m|sum(start=[]) %}
    {% set r = (flat|max) - (flat|min) %}
    {% if r > max_range %}
      {action_raise_error("Bed mesh range %.3f mm exceeds %.2f mm - check the bed for debris or a lifted sheet" % (r, max_range))}
    {% else %}
      {action_respond_info("Bed mesh range %.3f mm (limit %.2f)" % (r, max_range))}
    {% endif %}
  {% endif %}
