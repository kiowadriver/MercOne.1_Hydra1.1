[include mainsail.cfg]
[include huvud.cfg]
#[include neopixel.cfg]
[include macros.cfg]

# Main MCU: Duet3 Mini 5+ (SAME54P20) running Klipper as a USB-to-CAN bridge. The HUVUD
# toolboard (huvud.cfg) is on that CAN bus at 1 Mbit.
# See docs/Config_Reference.md for a description of parameters.

# CAN bus speed: in USB-to-CAN bridge mode the speed is compiled into the Duet firmware
# (make menuconfig "CAN bus speed"); the bitrate in /etc/network/interfaces.d/can0 is ignored.

# Flashing the Duet3 (saved build config: ~/klipper/config.duet)
# ------------------
# Build settings: SAME54P20, 16KiB bootloader (Duet3), 25MHz crystal, 120MHz,
#   Communication: USB to CAN bus bridge, CAN on PB15/PB14, CAN speed 1000000
# cd ~/klipper
# make clean KCONFIG_CONFIG=config.duet && make KCONFIG_CONFIG=config.duet
# sudo service klipper stop
# double tap the Duet reset button (flashing red LED = bootloader)
# make flash KCONFIG_CONFIG=config.duet FLASH_DEVICE=/dev/serial/by-id/usb-Duet3D_Duet3-Mini5+_189524355346513551202020FF0F4A15-if00
# sudo service klipper start
# Flash the HUVUD first and the Duet last (the Duet is the bridge). Full procedure: UPDATE_PLAN.md
# in the PC-side project.


# Pins for reference:
# Driver Step Pins - 0:PC26, 1:PC25, 2:PC24, 3:PC19, 4:PC16, 5:PC30, 6:PC18
# Driver Dir pins - 0:PB3, 1:PB29, 2:PB28, 3:PD20, 4:PD21, 5:PB0, 6:PA27
# Driver Enable - !PC28
# Uart addresses - 0:0 1:1 2:2 3:3 4:!0 5:!1 6:!2 | "!" is for inverted select pin
# Thermistor Pins - T0:PC0, T1:PC1, T2:PC2
# Vssa Sense:PB4 | Vref Sense:PB5
# Current Sense resistor for drivers - 0.056ohm (sense_resistor value per Klipper generic-duet3-mini.cfg)
# SPI lines:{PD11, PC7} -> Shared SerCom#7, SPIMosi:PC12, SPIMiso:PC15, SPISCLK:PC13
# Vin Monitor:PC3, uses 11:1 voltage divider
# LED's - Diag:PA31, Act:PA30
# 12864 LCD - LCDCSPIN:PC6, ENCA:PC11, ENCB:PD1, ENCSW:PB9, LCD A0:PA2, LCDBeep:PA9, LCD Neopixel Out:PB12 (shared with IO3.out)
# Neopixel Out - PA8
# Serial0 - TX:PB25, RX:PB24 (USB)
# Serial1 - TX:PB31, RX:PB30
# SBC SPISS pin:PA6, SBCTfrReady:PA3, SerComPins:{PA4, PA5, PA6, PA7}
# CAN Pins - TX:PB14 RX:PB15
# Heaters, Fan outputs - {Out0:PB17 Out1:PC10 Out2:PB13 Out3:PB11 Out4:PA11, Out5:PB2, Out6:PB1} | Out6 is shared with VFD_Out
# Tach Pins for Fans - {Out3.Tach:PB27 Out4.Tach:PB26}
# GPIO_out - {IO1:PB31 IO2:PD9 IO3:PB12 IO4:PD10} IO4 is shared with PSON
# GPIO_in - {IO1:PB30 IO2:PD8 IO3:PB7 IO4:PC5 IO5:PC4 IO6:PC31}
# Driver Diag - {D0:PA10, D1:PB8, D2:PA22, D3:PA23, D4:PC21, D5:PB10, D6:PA27}
# Mux Pin - PD0
# EXP headers only support 12864 LCD's


# Enable arcs support
[gcode_arcs]
resolution: 0.1

[stepper_x]
#driver1  LDO-42STH48-2504AH high temp (1.8degree)  rated 2.5A
#CoreXY belt A - left rear motor (Klipper: stepper_x = belt A; verified 2026-10-24)
step_pin: PC25
dir_pin: !PB29
enable_pin: !PC28
microsteps: 16
rotation_distance: 40
endstop_pin: !huvud:LIMIT_3 # PB12
position_endstop: 247
position_min: 0
position_max: 247
homing_speed: 25.0
homing_retract_speed: 5.0
second_homing_speed: 5.0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 1
run_current: 1.3 # speed test 2026-10-25: 1.0 A stalled at 400 mm/s, 1.3 A passed; Duet TMC2209 ~1.4 A RMS max
sense_resistor: 0.056

[stepper_y]
#driver0   LDO-42STH48-2504AH high temp (1.8degree)  rated 2.5A
#CoreXY belt B - right rear motor (Klipper: stepper_y = belt B)
step_pin: PC26
dir_pin: !PB3
enable_pin: !PC28
microsteps: 16
rotation_distance: 40
endstop_pin: !PB30
position_endstop: 225
position_min: 0
position_max: 225
homing_speed: 25.0
homing_retract_speed: 5.0
second_homing_speed: 5.0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 0
run_current: 1.3 # see stepper_x
sense_resistor: 0.056

[stepper_z]
#driver2  Creality 42-40(S)  (1.8degree)  @1A
#Lead_Screws = T8 PTFE Teflonoto Lead Screw 2MM 400
step_pin: PC24
dir_pin: PB28
enable_pin: !PC28
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
position_min: -5.0 # room for Beacon contact probing; was -15, which allowed commands 15 mm into the bed
homing_retract_dist: 0 # beacon needs this to be set to 0
position_max: 275
full_steps_per_rotation: 200

[stepper_z1]
#driver4  Creality 42-34 (1.8degree)  @1A
step_pin: PC16
dir_pin: PD21
enable_pin: !PC28
microsteps: 16
rotation_distance: 2
full_steps_per_rotation: 200

[stepper_z2]
#driver3   Creality 42-34 (1.8degree) @1A
step_pin: PC19
dir_pin: PD20
enable_pin: !PC28
microsteps: 16
rotation_distance: 2
full_steps_per_rotation: 200

[tmc2209 stepper_z]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 2
run_current: 0.8
sense_resistor: 0.056

[tmc2209 stepper_z1]
uart_pin: PA1
tx_pin: PA0
select_pins: !PD0
uart_address: 0
run_current: 0.8
sense_resistor: 0.056

[tmc2209 stepper_z2]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 3
run_current: 0.8
sense_resistor: 0.056

## EXTRUDERS
[tmc2209 extruder]
run_current: 0.5
sense_resistor: 0.110
uart_pin: huvud:EXT_UART_RX
tx_pin: huvud:EXT_UART_TX

[extruder]
step_pin: huvud:EXT_STEP
dir_pin: huvud:EXT_DIR
enable_pin: !huvud:EXT_EN
heater_pin: huvud:HE0
sensor_pin: huvud:TH1
sensor_type: PT1000  # Rapido HF
pullup_resistor: 2200            # 4700 is default and does not need defining, 2200 is used for the PT1000
min_extrude_temp: 170             
min_temp: 0
max_temp: 285
pressure_advance: 0.03
nozzle_diameter: 0.4
filament_diameter: 1.75
#control = pid
#pid_kp = 23.826
#pid_ki = 1.185
#pid_kd = 119.725
max_extrude_only_distance: 600 # default is 50mm

# LGX Lite
rotation_distance: 53.494165 # LGX Lite 5mm Drive Gears
gear_ratio: 44:10, 37:17 # LGX Lite - Gear Ratio Primary=44:10, Secondary=37:17
full_steps_per_rotation: 200 # 1.8 Degree Stepper
microsteps: 16

# Leadscrew positions, top view (rear at top), nozzle coordinates - matches z_positions below:
#  X=0                                 X=247
#  +-----------------------------------+  Y=225 (rear)
#  |          stepper_z (128.5, 224)   |
#  |                                   |
#  |                                   |
#  | stepper_z1 (9, 20.5)              |
#  |              stepper_z2 (243.5, 20.5)
#  +-----------------------------------+  Y=0 (front)

[z_tilt]
z_positions: # nozzle positions
  128.5, 224 #stepper_z Mini Tank
  9, 20.5 #stepper_z1 Mini Tank
  243.5, 20.5  #stepper_z2 Mini Tank
# NOZZLE coordinates; Beacon sits at nozzle + (0, -20). Kept inside the area Beacon already
# scans for the mesh (probe X 10-214, Y 2.5-180) so the coil is always fully over the bed.
# Old front points (y 0.5) put Beacon at y -19.5, likely off the bed edge.
points:
  128.5, 200  # rear centre  (Beacon at 128.5, 180)
  25, 30      # front left   (Beacon at 25, 10) - moved in 2026-10-25: Beacon reads 0.1-0.2 mm low within ~12 mm of the left edge
  220, 30     # front right  (Beacon at 220, 10)
speed: 100
horizontal_move_z: 30 # LEVEL_BED / START_PRINT override this per pass
retries: 5 # Number of times to retry if the probed points aren't within tolerance.
retry_tolerance:0.150

[adc_scaled vref_scaled]
vref_pin: PB5
vssa_pin: PB4

[heater_bed]
heater_pin: PB17 # Out0 -> SSR for the 110VAC bed heater
sensor_type: Generic 3950
sensor_pin: vref_scaled:PC0
#control: pid
pullup_resistor: 2200
#pid_Kp: 61.049
#pid_Ki: 2.339
#pid_Kd: 398.344
min_temp: 0
max_temp: 130

[heater_fan heatbreak_fan]
pin: PB11 # Out3 on the Duet (the hotend's own fan is [heater_fan extruder] on the HUVUD)


[temperature_fan duet_mcu_fan]
pin: PA11 # Out4
tachometer_pin: PB27 # NOTE: PB27 is Out3's tach (Out4's is PB26); reads ~1500 rpm while this fan is off - check wiring
max_power: 0.4 # fraction of full PWM (40%), not amps
sensor_type: temperature_mcu # Duet SAME54 chip temperature
max_temp: 55.0                # shutdown limit for the Duet MCU temperature
target_temp: 49.0             #Set this to your preferred running temperature
min_temp: 0
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.19
max_speed: 1.0
min_speed: 0.0
control: pid
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 2.0

[mcu]
#serial: /dev/ttyACM0
canbus_uuid: 3e1b9fbf635c

[printer]
kinematics: corexy
max_velocity: 400 # 500 mm/s reset the Pi's USB bus (2026-10-25); 400 passes the skipped-step test at 1.3 A
max_accel: 5800 # limited by the Y shaper below (mzv 44.4 Hz suggests <= 5800); X alone allows ~10300
max_z_velocity: 8
max_z_accel: 350
square_corner_velocity: 5

# From SHAPER_CALIBRATE 2026-10-24 19:08, after matching CoreXY belt tensions (both 57.7 Hz);
# Klipper's own recommendation for both axes. X: 1.9% residual vibration; Y: 3.5% (28 Hz secondary peak
# remains - printer/table rocking?). Data: snapshots/shaper/calibration_data_*_20261024_190830.csv.
# Keep the result HERE: do not press SAVE_CONFIG after SHAPER_CALIBRATE, or its recommendation lands
# in the auto block below and overrides this section.
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 59.2
shaper_type_y: mzv
shaper_freq_y: 44.4

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100


# EXP1 / EXP2 (display) pins
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PA9, EXP1_3=PC6, EXP1_5=<LCD_RST>, EXP1_7=<NC>, EXP1_9=<GND>,
    EXP1_2=PB9, EXP1_4=PA2, EXP1_6=PB12,      EXP1_8=<NC>, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PC15,  EXP2_3=PD1,  EXP2_5=PC11, EXP2_7=PD12,        EXP2_9=<GND>,
    EXP2_2=PC13, EXP2_4=PC14, EXP2_6=PC12, EXP2_8=<RESET_EXT>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of spi bus "sercom7"

# See the sample-lcd.cfg file for definitions of common LCD displays.

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevD_2510B6D4515137474C202020FF0D281B-if00
x_offset: 0 # NOT YET MEASURED - nozzle centre to Beacon coil centre (calipers)
y_offset: -20 # NOT YET MEASURED - Beacon is in front of the nozzle (toward Y=0)
contact_max_hotend_temperature: 180 # Beacon refuses contact above this; START_PRINT probes at 150
home_xy_position: 128.5, 112.5 # bed centre; the nozzle contacts the bed here
home_z_hop: 10 # blind bed drop before X/Y homing when Z is unknown; Y homes at the rear (high side)
home_z_hop_speed: 15
home_gcode_post_z: _BEACON_POST_Z # lift clear after every Z home until Z tilt is applied (macros.cfg)
home_xy_move_speed: 150
home_method: contact # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home

[bed_mesh]
# Beacon scans this area each print (START_PRINT: BED_MESH_CALIBRATE RUNS=2) and
# fits an 11x11 mesh (ADAPTIVE=1 shrinks it to the printed area when the slicer labels objects). mesh_min/max are PROBE (Beacon) coordinates, not nozzle.
speed: 75
horizontal_move_z: 10
mesh_min: 20, 5 #probe location; Beacon edge effect below x~15 (measured 2026-10-25, tools/edge-compare.ps1)
mesh_max: 220, 200 #probe location; edge effect starts ~x235
probe_count: 11, 11
adaptive_margin: 5
fade_start: 1
fade_end: 10
algorithm: bicubic
zero_reference_position: 128.5, 112.5 # = beacon home_xy_position, so mesh Z=0 is where Z is homed

[force_move]
enable_force_move: True # needed by BED_DOWN to lower the bed before Z is homed

#####################################################################
#                     Idle timeout and misc
#####################################################################

# After 10 minutes with no activity (not while a print is running), turn off heaters, part fan and motors.
# This also applies during a PAUSE; set variable_idle_timeout in mainsail.cfg's _CLIENT_VARIABLE for longer pauses.
# Previously called _KM_IDLE_TIMEOUT from klipper-macros, which is not installed, so it errored instead.
[idle_timeout]
timeout: 600
gcode:
  TURN_OFF_HEATERS
  M107
  M84

[save_variables]
filename: ~/printer_data/config/variables.cfg

[exclude_object]

# All macros (START_PRINT, END_PRINT, LEVEL_BED, BED_DOWN, filament, M600...) are in macros.cfg.
# PAUSE / RESUME / CANCEL_PRINT, [pause_resume], [virtual_sdcard], [display_status], [respond] come from mainsail.cfg.

