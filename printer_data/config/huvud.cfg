[board_pins huvud_62]

# Flashing the HUVUD (bootloader: Katapult at 1M since 2026-10-24; the old 250K CanBoot is gone)
# ------------------
# Build settings (saved as ~/klipper/config.huvud): STM32F103, 8 KiB bootloader, 8MHz crystal,
#   Communication: CAN bus on PB8/PB9, CAN speed 1000000
# cd ~/klipper
# make clean KCONFIG_CONFIG=config.huvud && make KCONFIG_CONFIG=config.huvud
# sudo service klipper stop
# python3 ~/katapult/scripts/flashtool.py -i can0 -u af9086bd212e -f ~/klipper/out/klipper.bin
# sudo service klipper start
# Flash the HUVUD before the Duet (the Duet is the CAN bridge).


# All pin naming based on the HUVUD 0.62 silkscreen
mcu: huvud
aliases:
aliases_step:
    EXT_EN=PB5,EXT_STEP=PB3,EXT_DIR=PB4,EXT_UART_TX=PA9,EXT_UART_RX=PA10,EXT_DIAG=PA15
aliases_limitsw: # these are preferred for endstops (including klicky)
    LIMIT_1=PB10,LIMIT_2=PB11,LIMIT_3=PB12
aliases_bltouch: # these are the dupont connectors for bltouch
    PROBE_1=PC15,PROBE_2=PB1
aliases_fans:
    FAN0=PA8,FAN1=PA7
aliases_thermistors:
    TH0=PA0,TH1=PA1
aliases_heaters:
    HE0=PA6
aliases_rgb:
    LED=PC13
aliases_adxl:
    ADXL=PB1
aliases_aux:
    AUX0=PA13,AUX1=PA14

## MCU
[mcu huvud]
canbus_uuid: af9086bd212e # run the following command to locate the uuid >   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0

## huvud
[temperature_sensor CANBOARD]
sensor_type: temperature_mcu
sensor_mcu: huvud


## FANS
# Heatbreak fan
[heater_fan extruder]
pin: huvud:FAN0
heater: extruder

# Part cooling fan
[fan]
pin: huvud:FAN1


# # For toolhead/ extra sensors a'la ERCF
# [filament_switch_sensor can0_sensor]
# pause_on_runout: False
# switch_pin: !huvud:LIMIT_3


## ADXL
[adxl345]
cs_pin: huvud:ADXL
spi_bus: spi2
axes_map: x, z, y # chip is mounted with its Y vertical; measured 2026-10-24 with test moves (tools/remote/axes_detect.py)

[resonance_tester]
accel_chip: adxl345
probe_points:
    123.5, 112.5, 20  # centre of travel (X 0-247, Y 0-225), bed lowered to Z20

## LEDS 
[output_pin huvud_led] # the blue one
pin: !huvud:LED
pwm: 1              # Allow brightness control
cycle_time: 0.01    # Fast enough to dim instead of flash

[neopixel stealthburner]
# Using the SWD pin as Data (PA13 on the pinout)
pin: huvud:AUX0
chain_count: 3
color_order: GRB
initial_RED: 0.1
